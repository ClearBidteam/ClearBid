<!DOCTYPE html>
<html>
<head>
    <title>ClearBid Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f8fb;
            text-align: center;
            padding-top: 50px;
        }

        .login-box {
            background: white;
            width: 320px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h1 {
            color: #0066cc;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            background: #00a86b;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.8;
        }

        a {
            color: #0066cc;
        }
    </style>
</head>

<body>

<div class="login-box">

<h1>ClearBid</h1>

<h2>Login</h2>

<input type="email" placeholder="Email">

<input type="password" placeholder="Password">

<br>

<button>Login</button>

<p>
Don't have an account?
<a href="signup.html">Sign Up</a>
</p>

</div>

</body>
</html>
